name: ciclo-diario

on:
  schedule:
    # Lun–Vie 22:20 UTC → después del cierre de NYSE (21:00 UTC en invierno, 20:00 en verano)
    - cron: "20 22 * * 1-5"
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      replay:
        description: "Rehacer N días pasados (0 = solo hoy)"
        default: "0"

permissions:
  contents: write             # para guardar la cartera y el panel en el repo

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kronos (código)
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos

      - name: Caché de pesos Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-small-v1

      - name: Dependencias
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Tests de riesgo
        run: python tests/test_risk.py

      - name: Ciclo de trading (paper)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # solo si decision.mode = claude
        run: python -m trader.run --replay "${{ github.event.inputs.replay || 0 }}"

      - name: Guardar estado
        run: |
          git config user.name  "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "ciclo $(date -u +%F)"
          git push
