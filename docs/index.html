<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kronos Trader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060a; --panel:#080d14; --panel2:#0b121b; --line:#16212f; --line2:#1f2e40;
  --tx:#c8d3e2; --dim:#5d6d82; --dim2:#3a4758;
  --cyan:#2ef2e0; --cyan2:#13b8c9; --gold:#ffc66b; --up:#35e89f; --down:#ff4f6e; --violet:#8f7cff;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:12px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:14px;background:
  radial-gradient(1200px 600px at 60% 30%,rgba(46,242,224,.05),transparent 60%),var(--bg)}
.frame{max-width:1480px;margin:0 auto;border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#060a10,#04070b);box-shadow:0 0 0 1px rgba(46,242,224,.04),0 30px 80px rgba(0,0,0,.6)}
/* ── top bar ── */
.top{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid var(--line);background:#060b11}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;display:block}
.brand{font-weight:700;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 12px rgba(46,242,224,.5)}
.brand span{color:var(--tx);font-weight:400}
.tabs{display:flex;gap:4px;margin-left:6px}
.tab{padding:4px 10px;border:1px solid var(--line2);border-radius:6px;color:var(--dim);cursor:pointer;background:transparent;font:inherit;transition:.15s}
.tab:hover{color:var(--tx);border-color:var(--dim2)}
.tab.on{color:var(--bg);background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(46,242,224,.45)}
.tab .s{margin-left:6px;font-size:10px}
.tab.on .s{color:var(--bg)!important}
.sp{flex:1}
.badge{padding:3px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--dim);font-size:10px;letter-spacing:.08em}
.badge.warn{color:var(--gold);border-color:rgba(255,198,107,.4);background:rgba(255,198,107,.06)}
.badge.ok{color:var(--up);border-color:rgba(53,232,159,.35)}
.eqtop{font-size:14px;font-weight:700;color:#fff}
/* ── layout ── */
.main{display:grid;grid-template-columns:230px 1fr;min-height:520px;border-bottom:1px solid var(--line)}
.side{border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px;background:#05090e}
.box{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.box h3{font-size:10px;letter-spacing:.14em;color:var(--dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.box h3 b{color:var(--cyan);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 10px;font-size:11px}
.kv dt{color:var(--dim)}.kv dd{text-align:right;color:var(--tx)}
.uni{padding:4px}
.uni button{all:unset;display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:center;width:100%;box-sizing:border-box;padding:6px;border-radius:6px;cursor:pointer;font-size:11px}
.uni button:hover{background:var(--panel2)}
.uni button.on{background:rgba(46,242,224,.07);box-shadow:inset 2px 0 0 var(--cyan)}
.pbar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan2),var(--cyan))}
.chartwrap{position:relative;min-height:520px}
#chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.tip{position:absolute;pointer-events:none;padding:6px 8px;border:1px solid var(--line2);background:rgba(6,10,16,.92);border-radius:6px;font-size:10.5px;line-height:1.5;display:none;white-space:nowrap;z-index:3}
.legend{position:absolute;left:14px;top:12px;display:flex;gap:14px;font-size:10px;color:var(--dim);z-index:2}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
/* ── panels ── */
.row{display:grid;gap:10px;padding:10px;border-bottom:1px solid var(--line)}
.r1{grid-template-columns:1.05fr 1fr 1.15fr 1.5fr}
.r2{grid-template-columns:1.4fr 1fr 1.3fr}
.big{font-size:30px;font-weight:700;color:var(--gold);text-shadow:0 0 18px rgba(255,198,107,.35);padding:10px 10px 0}
.sub{color:var(--dim);font-size:10.5px;padding:2px 10px 8px}
.range{margin:6px 10px 12px;height:30px;position:relative}
.range .track{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--down),#43506a 50%,var(--up));opacity:.55}
.range .mk{position:absolute;top:6px;width:2px;height:18px;background:#fff;box-shadow:0 0 8px #fff}
.range .lb{position:absolute;top:24px;font-size:9.5px;color:var(--dim);transform:translateX(-50%)}
.updown{display:flex;justify-content:space-between;align-items:baseline;padding:10px 10px 4px}
.updown .u{font-size:26px;font-weight:700;color:var(--up)}.updown .d{font-size:26px;font-weight:700;color:var(--down)}
.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;padding:6px 10px 12px}
.cells i{aspect-ratio:1;border-radius:2px;display:block}
.votes{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.vote{display:grid;grid-template-columns:78px 1fr 40px;align-items:center;gap:8px;font-size:11px}
.vote .bar{height:6px;background:var(--line);border-radius:3px;position:relative}
.vote .bar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim2)}
.vote .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.vote small{grid-column:1/-1;color:var(--dim);font-size:10px;margin-top:-4px}
.verdict{margin:4px 10px 10px;padding:8px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2)}
.verdict b{font-size:15px;letter-spacing:.1em}
.term{font-size:10.5px;line-height:1.65;padding:8px 10px;max-height:206px;overflow:auto;color:#9fb0c4}
.term .ok{color:var(--up)}.term .dn{color:var(--down)}.term .rk{color:var(--gold)}.term .dim{color:var(--dim)}
.term::-webkit-scrollbar,.tbl::-webkit-scrollbar{width:6px}.term::-webkit-scrollbar-thumb,.tbl::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
#equity{width:100%;height:170px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats div{padding:8px 10px;border-right:1px solid var(--line)}.stats div:last-child{border-right:0}
.stats span{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.1em;margin-bottom:3px}
.stats b{font-size:14px}
.tbl{max-height:230px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{color:var(--dim);font-weight:500;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);font-size:9.5px;letter-spacing:.1em;position:sticky;top:0;background:var(--panel)}
td{text-align:right;padding:5px 10px;border-bottom:1px solid #0f1822}
th:first-child,td:first-child{text-align:left}
.pos{color:var(--up)}.neg{color:var(--down)}.muted{color:var(--dim)}
.foot{padding:10px 14px;color:var(--dim2);font-size:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.empty{padding:16px 10px;color:var(--dim);font-size:11px}
@media (max-width:1100px){.main{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto}.side .box{min-width:220px}
  .r1,.r2{grid-template-columns:1fr 1fr}.chartwrap{min-height:420px}}
@media (max-width:640px){.r1,.r2{grid-template-columns:1fr}.tabs{overflow:auto}.top{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="brand">KRONOS <span>FORECAST</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="sp"></div>
    <span class="badge" id="bInterval">1D</span>
    <span class="badge" id="bBroker"></span>
    <span class="badge warn" id="bDemo" style="display:none">DATOS DEMO</span>
    <span class="badge" id="bAsof"></span>
    <span class="eqtop" id="eqTop"></span>
  </div>

  <div class="main">
    <aside class="side">
      <div class="box">
        <h3>MODELO <b id="engine"></b></h3>
        <dl class="kv" id="modelkv"></dl>
      </div>
      <div class="box">
        <h3>UNIVERSO <b>P(↑)</b></h3>
        <div class="uni" id="uni"></div>
      </div>
      <div class="box">
        <h3>RIESGO <b>en código</b></h3>
        <dl class="kv" id="riskkv"></dl>
      </div>
    </aside>
    <div class="chartwrap">
      <div class="legend">
        <span><i style="background:var(--cyan)"></i>escenarios ↑</span>
        <span><i style="background:var(--down)"></i>escenarios ↓</span>
        <span><i style="background:var(--gold)"></i>media</span>
      </div>
      <canvas id="chart"></canvas>
      <div class="tip" id="tip"></div>
    </div>
  </div>

  <div class="row r1">
    <div class="box">
      <h3>ÚLTIMO CIERRE <b id="pxT"></b></h3>
      <div class="big" id="px"></div>
      <div class="sub" id="pxSub"></div>
      <div class="range" id="range"></div>
      <dl class="kv" id="pxExtra" style="border-top:1px solid var(--line);grid-template-columns:auto 1fr auto 1fr"></dl>
    </div>
    <div class="box">
      <h3>ESCENARIOS <b id="scH"></b></h3>
      <div class="updown"><span class="u" id="nUp"></span><span class="muted" id="pUp"></span><span class="d" id="nDn"></span></div>
      <div class="cells" id="cells"></div>
    </div>
    <div class="box">
      <h3>COMITÉ DE AGENTES <b id="src"></b></h3>
      <div class="votes" id="votes"></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="box">
      <h3>AGENT LOG <b id="logN"></b></h3>
      <div class="term" id="term"></div>
    </div>
  </div>

  <div class="row r2">
    <div class="box">
      <h3>CARTERA vs <b id="bench"></b></h3>
      <canvas id="equity"></canvas>
      <div class="stats" id="pstats"></div>
    </div>
    <div class="box">
      <h3>POSICIONES <b id="posN"></b></h3>
      <div class="tbl" id="pos"></div>
    </div>
    <div class="box">
      <h3>OPERACIONES <b id="trN"></b></h3>
      <div class="tbl" id="trades"></div>
    </div>
  </div>
  <div class="foot">
    <span id="gen"></span>
    <span>Uso personal · simulación en paper trading · no es asesoramiento financiero</span>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {cyan:css('--cyan'),up:css('--up'),down:css('--down'),gold:css('--gold'),dim:css('--dim'),line:css('--line'),tx:css('--tx')};
const fmt = (v,d=2) => v==null||isNaN(v) ? '—' : Number(v).toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=1,sign=true) => v==null||isNaN(v) ? '—' : (sign&&v>0?'+':'')+(v*100).toFixed(d)+'%';
const cls = v => v>0?'pos':v<0?'neg':'muted';
let S, cur, t0 = 0, hover = null, geom = null;

async function load(){
  if (window.__STATE__) return window.__STATE__;
  const r = await fetch('data/state.json?'+Date.now());
  if(!r.ok) throw new Error('No encuentro data/state.json');
  return r.json();
}

function header(){
  $('bBroker').textContent = (S.broker==='paper'?'PAPER':'IBKR')+' · '+S.decision_mode.toUpperCase();
  $('bBroker').className = 'badge ok';
  $('bDemo').style.display = S.demo ? '' : 'none';
  $('bAsof').textContent = 'AS OF '+S.as_of;
  $('eqTop').textContent = fmt(S.portfolio.equity,0)+' $';
  $('engine').textContent = S.engine;
  $('gen').textContent = 'generado '+S.generated_at.replace('T',' ').replace('+00:00',' UTC');
  const tabs = $('tabs'); tabs.innerHTML='';
  S.universe.forEach(t=>{
    const st=S.tickers[t].forecast.stats, b=document.createElement('button');
    b.className='tab'+(t===cur?' on':''); b.innerHTML=`${t}<span class="s" style="color:${st.exp_return>0?C.up:C.down}">${pct(st.exp_return,1)}</span>`;
    b.onclick=()=>select(t); tabs.appendChild(b);
  });
  const r=S.risk;
  $('riskkv').innerHTML = [
    ['máx. posición',pct(r.max_position_pct,0,false)],['exposición máx.',pct(r.max_gross_exposure_pct,0,false)],
    ['caja mínima',pct(r.min_cash_pct,0,false)],['stop-loss',pct(-r.stop_loss_pct,0)],
    ['freno diario',pct(-r.max_daily_loss_pct,0)],['confianza mín.',pct(r.min_confidence,0,false)],
    ['órdenes/ciclo',r.max_trades_per_run],['solo largos',r.long_only?'sí':'no']
  ].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  const uni=$('uni'); uni.innerHTML='';
  S.universe.forEach(t=>{
    const d=S.tickers[t], st=d.forecast.stats, a=d.signal.action;
    const col=a==='BUY'?C.up:a==='SELL'?C.down:C.dim;
    const b=document.createElement('button'); b.className=t===cur?'on':'';
    b.innerHTML=`<b>${t}</b><div class="pbar"><i style="width:${st.p_up*100}%"></i></div><span style="color:${col}">${a} ${(st.p_up*100).toFixed(0)}%</span>`;
    b.onclick=()=>select(t); uni.appendChild(b);
  });
}

function select(t){ cur=t; header(); panels(); start(); }

function panels(){
  const d=S.tickers[cur], fc=d.forecast, st=fc.stats, sig=d.signal;
  $('modelkv').innerHTML=[
    ['ticker',cur],['motor',fc.engine],['contexto',d.candles.length+'+ velas'],['horizonte',st.horizon+' sesiones'],
    ['escenarios',st.samples],['dispersión',pct(st.dispersion,1,false)],['vol. 20d',pct(d.features.vol_20d_ann,0,false)],['RSI14',d.features.rsi14.toFixed(0)]
  ].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  // precio
  $('pxT').textContent=cur;
  $('px').textContent=fmt(fc.last_close);
  $('pxSub').innerHTML=`mediana a ${st.horizon}d <b style="color:${st.median_return>0?C.up:C.down}">${fmt(st.p50)} (${pct(st.median_return)})</b>`;
  const lo=Math.min(st.p10,fc.last_close)*0.995, hi=Math.max(st.p90,fc.last_close)*1.005, X=v=>((v-lo)/(hi-lo)*100).toFixed(2)+'%';
  $('range').innerHTML=`<div class="track"></div>
    <div class="mk" style="left:${X(st.p10)};background:${C.down};box-shadow:0 0 8px ${C.down}"></div>
    <div class="mk" style="left:${X(fc.last_close)}"></div>
    <div class="mk" style="left:${X(st.p90)};background:${C.up};box-shadow:0 0 8px ${C.up}"></div>
    <div class="lb" style="left:0;transform:none">p10 ${fmt(st.p10)}</div><div class="lb" style="left:auto;right:0;transform:none">p90 ${fmt(st.p90)}</div>`;
  $('pxExtra').innerHTML=[['E[r] '+st.horizon+'d',pct(st.exp_return,2)],['P(↑)',pct(st.p_up,0,false)],['dispersión',pct(st.dispersion,1,false)],['ret. 20d',pct(d.features.ret_20d,1)],['vs SMA50',pct(d.features.close/d.features.sma50-1,1)],['desde máx.',pct(d.features.drawdown_from_high,1)]]
    .map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  // escenarios
  $('scH').textContent=st.samples+' futuros';
  $('nUp').textContent=st.n_up; $('nDn').textContent=st.n_down;
  $('pUp').textContent='P(↑) '+(st.p_up*100).toFixed(0)+'%';
  const term=fc.paths.map(p=>p[p.length-1]/fc.last_close-1).sort((a,b)=>b-a), m=Math.max(...term.map(Math.abs))||1;
  $('cells').innerHTML=term.map(r=>{const a=.25+.75*Math.abs(r)/m;return `<i title="${pct(r)}" style="background:${r>0?C.up:C.down};opacity:${a.toFixed(2)}"></i>`}).join('');
  // comité
  $('src').textContent=sig.source;
  $('votes').innerHTML=sig.votes.map(v=>{
    const w=Math.abs(v.score)*50, col=v.score>0?C.up:v.score<0?C.down:C.dim, left=v.score>=0?50:50-w;
    return `<div class="vote"><span>${v.agent}</span><div class="bar"><i style="left:${left}%;width:${w}%;background:${col};box-shadow:0 0 8px ${col}"></i></div>
      <span class="${cls(v.score)}" style="text-align:right">${v.score>0?'+':''}${v.score.toFixed(2)}</span><small>${esc(v.note)}</small></div>`}).join('');
  const ac=sig.action==='BUY'?C.up:sig.action==='SELL'?C.down:C.gold;
  $('verdict').style.borderColor=ac+'66'; $('verdict').style.background=ac+'10';
  $('verdict').innerHTML=`<b style="color:${ac}">${sig.action}</b><span>objetivo ${pct(sig.target_weight,0,false)} · conf ${pct(sig.confidence,0,false)}</span>`;
  // log
  const lines=S.log.filter(l=>l.includes(' '+cur+' ')||l.includes('FILL')||l.includes('RISK')).slice(-40);
  $('logN').textContent=lines.length+' líneas';
  $('term').innerHTML=lines.map(l=>{
    let c='';if(l.includes('FILL'))c=l.includes('BUY')?'ok':'dn';else if(l.includes('RISK'))c='rk';
    return `<div class="${c}"><span class="dim">›</span> ${esc(l)}</div>`}).join('');
  $('term').scrollTop=1e9;
  portfolio();
}

function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function portfolio(){
  const P=S.portfolio, h=P.equity_history, s0=P.starting_cash||h[0]?.equity||P.equity;
  $('bench').textContent=S.benchmark;
  const ret=P.equity/s0-1, bret=h.length>1?h[h.length-1].bench/h[0].bench-1:null;
  let peak=-Infinity,mdd=0;h.forEach(x=>{peak=Math.max(peak,x.equity);mdd=Math.min(mdd,x.equity/peak-1)});
  $('pstats').innerHTML=[
    ['RENTAB.',`<b class="${cls(ret)}">${pct(ret,2)}</b>`],[S.benchmark,`<b class="${cls(bret)}">${pct(bret,2)}</b>`],
    ['MAX DD',`<b class="neg">${pct(mdd,1)}</b>`],['ACIERTO',`<b>${P.win_rate==null?'—':pct(P.win_rate,0,false)}</b>`]
  ].map(([k,v])=>`<div><span>${k}</span>${v}</div>`).join('');
  $('posN').textContent=P.positions.length+' · caja '+fmt(P.cash,0)+' $';
  $('pos').innerHTML=P.positions.length?`<table><tr><th>TICKER</th><th>QTY</th><th>MEDIO</th><th>PRECIO</th><th>PESO</th><th>P&L</th></tr>${
    P.positions.map(p=>`<tr><td>${p.ticker}</td><td>${fmt(p.qty,0)}</td><td>${fmt(p.avg_price)}</td><td>${fmt(p.price)}</td><td>${pct(p.weight,1,false)}</td><td class="${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</td></tr>`).join('')}</table>`
    :'<div class="empty">Sin posiciones abiertas: todo en caja.</div>';
  const T=[...S.trades].reverse();
  $('trN').textContent=P.n_trades+' totales';
  $('trades').innerHTML=T.length?`<table><tr><th>FECHA</th><th>LADO</th><th>TICKER</th><th>QTY</th><th>PRECIO</th><th>P&L</th></tr>${
    T.map(t=>`<tr><td class="muted">${t.run.slice(0,10)}</td><td class="${t.side==='BUY'?'pos':'neg'}">${t.side}</td><td>${t.ticker}</td><td>${fmt(t.qty,0)}</td><td>${fmt(t.price)}</td><td class="${cls(t.pnl)}">${t.pnl==null?'—':fmt(t.pnl)}</td></tr>`).join('')}</table>`
    :'<div class="empty">Aún no hay operaciones.</div>';
  drawEquity();
}

/* ───────── canvas helpers ───────── */
function fit(cv){
  const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); return [ctx,r.width,r.height];
}
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const ease=t=>1-Math.pow(1-t,3);

function drawChart(prog){
  const cv=$('chart'), [ctx,W,H]=fit(cv), d=S.tickers[cur], fc=d.forecast;
  const candles=d.candles.slice(-90), hz=fc.dates.length;
  const padL=16,padR=74,padT=40,padB=30, plotW=W-padL-padR, plotH=H-padT-padB;
  const histW=plotW*0.66, futW=plotW-histW, step=histW/candles.length, fstep=futW/hz;
  const xNow=padL+histW-step/2;
  let lo=Infinity,hi=-Infinity;
  candles.forEach(c=>{lo=Math.min(lo,c[3]);hi=Math.max(hi,c[2])});
  fc.paths.forEach(p=>p.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  const Y=v=>padT+(hi-v)/(hi-lo)*plotH, Xh=i=>padL+i*step+step/2, Xf=j=>xNow+(j+1)*fstep;
  geom={candles,Xh,Y,step,padL,histW,xNow,fstep,fc,lo,hi,padT,plotH};

  // fondo: rejilla
  ctx.fillStyle='#04070b';ctx.fillRect(0,0,W,H);
  const fut=ctx.createLinearGradient(xNow,0,W,0);fut.addColorStop(0,'rgba(46,242,224,.045)');fut.addColorStop(1,'rgba(46,242,224,0)');
  ctx.fillStyle=fut;ctx.fillRect(xNow,padT,W-padR-xNow,plotH);
  ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.font='10px JetBrains Mono, monospace';ctx.fillStyle=C.dim;ctx.textAlign='left';
  const ticks=6;for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks,y=Y(v);
    ctx.globalAlpha=.6;ctx.beginPath();ctx.moveTo(padL,y+.5);ctx.lineTo(W-padR,y+.5);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillText(fmt(v),W-padR+8,y+3)}
  ctx.textAlign='center';
  for(let i=0;i<candles.length;i+=15){ctx.fillText(candles[i][0].slice(5),Xh(i),H-10)}
  ctx.fillText(fc.dates[hz-1].slice(5),Xf(hz-1),H-10);

  // velas
  const bw=Math.max(1.5,step*0.55);
  candles.forEach((c,i)=>{const [_,o,h,l,cl]=c,x=Xh(i),up=cl>=o,col=up?C.up:C.down;
    ctx.strokeStyle=hexA(col,.75);ctx.beginPath();ctx.moveTo(x,Y(h));ctx.lineTo(x,Y(l));ctx.stroke();
    ctx.fillStyle=hexA(col,up?.85:.9);const y1=Y(Math.max(o,cl)),y2=Y(Math.min(o,cl));ctx.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
  });

  // haz vertical "ahora"
  const beam=ctx.createLinearGradient(0,padT,0,padT+plotH);
  beam.addColorStop(0,'rgba(46,242,224,0)');beam.addColorStop(.5,'rgba(46,242,224,.55)');beam.addColorStop(1,'rgba(46,242,224,0)');
  ctx.fillStyle=beam;ctx.fillRect(xNow-1,padT,2,plotH);
  ctx.fillStyle='rgba(46,242,224,.06)';ctx.fillRect(xNow-14,padT,28,plotH);

  // escenarios
  const P=ease(Math.min(prog,1)), last=fc.last_close, n=hz*P;
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineWidth=1;
  fc.paths.forEach(p=>{
    const r=p[hz-1]/last-1, col=r>0?C.cyan:C.down;
    ctx.strokeStyle=hexA(col,.28);ctx.shadowColor=col;ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(xNow,Y(last));
    for(let j=0;j<hz;j++){ if(j+1>n){const f=n-j;if(f>0){const pv=j?p[j-1]:last;ctx.lineTo(xNow+(j+f)*fstep,Y(pv+(p[j]-pv)*f))}break}
      ctx.lineTo(Xf(j),Y(p[j]))}
    ctx.stroke();
  });
  // media
  const mp=fc.stats.mean_path;
  [[8,.18],[4,.35],[1.8,1]].forEach(([w,a])=>{
    ctx.strokeStyle=hexA(C.gold,a);ctx.lineWidth=w;ctx.shadowColor=C.gold;ctx.shadowBlur=a===1?14:0;
    ctx.beginPath();ctx.moveTo(xNow,Y(last));
    for(let j=0;j<hz&&j+1<=Math.ceil(n);j++){const f=Math.min(1,n-j),pv=j?mp[j-1]:last;ctx.lineTo(xNow+(j+f)*fstep,Y(pv+(mp[j]-pv)*f))}
    ctx.stroke()});
  ctx.restore();

  // orbe
  const ox=xNow,oy=Y(last),g=ctx.createRadialGradient(ox,oy,0,ox,oy,26);
  g.addColorStop(0,'rgba(220,255,252,1)');g.addColorStop(.18,'rgba(46,242,224,.9)');g.addColorStop(1,'rgba(46,242,224,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ox,oy,26,0,Math.PI*2);ctx.fill();

  // etiqueta superior
  ctx.font='500 10px JetBrains Mono, monospace';
  const lab=`◆ KRONOS · ${fc.stats.samples} futuros · ${hz}d`, lw=ctx.measureText(lab).width+16;
  ctx.fillStyle='rgba(8,14,20,.9)';ctx.strokeStyle=hexA(C.cyan,.5);
  rr(ctx,xNow-lw/2,padT-28,lw,18,4);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.cyan;ctx.textAlign='center';ctx.fillText(lab,xNow,padT-15.5);

  // tags derecha
  if(prog>=1){
    const st=fc.stats, tags=[[st.p90,C.up,'p90'],[st.p50,C.gold,'p50'],[st.p10,C.down,'p10'],[last,'#ffffff','now']];
    const used=[];
    tags.sort((a,b)=>b[0]-a[0]).forEach(([v,col,l])=>{
      let y=Y(v); used.forEach(u=>{if(Math.abs(u-y)<16)y=u+16}); used.push(y);
      ctx.fillStyle=hexA(col==='#ffffff'?'#ffffff':col,.14);ctx.strokeStyle=col;
      rr(ctx,W-padR+3,y-8,padR-6,16,3);ctx.fill();ctx.stroke();
      ctx.fillStyle=col;ctx.textAlign='left';ctx.font='500 10px JetBrains Mono, monospace';ctx.fillText(fmt(v),W-padR+8,y+3.5);
      ctx.fillStyle=hexA(col,.8);ctx.textAlign='right';ctx.fillText(l,W-padR-6,y+3.5);
    });
  }

  // hover
  if(hover){const {x,y}=hover;
    ctx.strokeStyle='rgba(200,211,226,.25)';ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(x,padT);ctx.lineTo(x,padT+plotH);ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();ctx.setLineDash([])}
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

function drawEquity(){
  const cv=$('equity'),[ctx,W,H]=fit(cv),h=S.portfolio.equity_history;
  ctx.clearRect(0,0,W,H);
  if(h.length<2){ctx.fillStyle=C.dim;ctx.font='11px JetBrains Mono, ui-monospace, monospace';ctx.fillText('El histórico aparece tras el segundo ciclo.',12,24);return}
  const e0=h[0].equity, b0=h[0].bench, a=h.map(x=>x.equity/e0-1), b=h.map(x=>x.bench/b0-1);
  let lo=Math.min(...a,...b,0),hi=Math.max(...a,...b,0);const pd=(hi-lo)*.12||.01;lo-=pd;hi+=pd;
  const L=8,R=52,T=12,B=20,X=i=>L+i/(h.length-1)*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  ctx.strokeStyle=C.line;ctx.fillStyle=C.dim;ctx.font='9.5px JetBrains Mono, ui-monospace, monospace';
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillText(pct(v,1),W-R+6,y+3)}
  ctx.strokeStyle='rgba(200,211,226,.3)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(W-R,Y(0));ctx.stroke();ctx.setLineDash([]);
  ctx.textAlign='left';ctx.fillText(h[0].date,L,H-5);ctx.textAlign='right';ctx.fillText(h[h.length-1].date,W-R,H-5);ctx.textAlign='left';
  ctx.strokeStyle=hexA('#8f7cff',.85);ctx.lineWidth=1.3;ctx.beginPath();b.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();
  const gr=ctx.createLinearGradient(0,T,0,H-B);gr.addColorStop(0,'rgba(46,242,224,.25)');gr.addColorStop(1,'rgba(46,242,224,0)');
  ctx.beginPath();a.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.lineTo(X(a.length-1),Y(lo));ctx.lineTo(X(0),Y(lo));ctx.closePath();ctx.fillStyle=gr;ctx.fill();
  ctx.strokeStyle=C.cyan;ctx.lineWidth=1.8;ctx.shadowColor=C.cyan;ctx.shadowBlur=8;ctx.beginPath();a.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=C.cyan;ctx.fillText('cartera',L+4,T+10);ctx.fillStyle='#8f7cff';ctx.fillText(S.benchmark,L+64,T+10);
}

const DUR=1300;
function start(){ t0=performance.now(); requestAnimationFrame(tick); }
function tick(now){ const p=(now-t0)/DUR; drawChart(Math.min(p,1)); if(p<1) requestAnimationFrame(tick); }

const cv=$('chart'), tip=$('tip');
cv.addEventListener('mousemove',e=>{
  if(!geom)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;hover={x,y};
  const g=geom;let html='';
  if(x<g.xNow){const i=Math.round((x-g.padL-g.step/2)/g.step);const c=g.candles[i];
    if(c)html=`<b>${c[0]}</b><br>O ${fmt(c[1])} · H ${fmt(c[2])}<br>L ${fmt(c[3])} · C <b>${fmt(c[4])}</b>`}
  else{const j=Math.min(g.fc.dates.length-1,Math.max(0,Math.round((x-g.xNow)/g.fstep)-1));
    const col=g.fc.paths.map(p=>p[j]).sort((a,b)=>a-b),q=k=>col[Math.floor(k*(col.length-1))];
    html=`<b>${g.fc.dates[j]}</b> · día +${j+1}<br><span style="color:${C.up}">p90 ${fmt(q(.9))}</span><br><span style="color:${C.gold}">media ${fmt(g.fc.stats.mean_path[j])}</span><br><span style="color:${C.down}">p10 ${fmt(q(.1))}</span>`}
  const price=g.hi-(y-g.padT)/g.plotH*(g.hi-g.lo);html+=`<br><span style="color:${C.dim}">cursor ${fmt(price)}</span>`;
  tip.innerHTML=html;tip.style.display='block';
  tip.style.left=Math.min(x+14,r.width-170)+'px';tip.style.top=Math.max(8,y-70)+'px';drawChart(9);
});
cv.addEventListener('mouseleave',()=>{hover=null;tip.style.display='none';drawChart(9)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawChart(9);drawEquity()},80)});

load().then(s=>{S=s;cur=s.universe[0];header();panels();start()})
  .catch(e=>{document.querySelector('.chartwrap').innerHTML=`<div class="empty">${esc(e.message)}</div>`});
})();
</script>
